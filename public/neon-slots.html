  <style>
    :root {
      --gold: #f5c542;
      --gold-dark: #b8860b;

    * {

    }
    html, body {

      height: 100vh;

      overflow: hidden;

    /* ─── الشريط العلوي الفاخر ─── */

      position: relative;
      z-index: 100;
      flex: 0 0 auto;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: linear-gradient(90deg, #100a20 0%, #1c0d38 50%, #0d071a 100%);
      border-bottom: 1px solid rgba(245, 197, 66, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .la-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .la-btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e5d8ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .la-btn-back:hover {

      border-color: var(--gold);
      color: #fff;

    }

    .la-game-title {

    .la-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .la-wallet {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(245, 197, 66, 0.35);

      border-radius: 999px;

    }

    .la-loadfail {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

    }

    .la-loadfail small { color: #b9a8d6; }
    .la-loadfail button {
      background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
      color: #0b0714;
      border: none;
      border-radius: 10px;
      padding: 10px 26px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    /* ─── شريط التنبيه المباشر ─── */
    .guest-banner {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 24px);
      background: rgba(18, 14, 33, 0.95);
      border: 1px solid var(--gold);
      color: #fff;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      pointer-events: auto;
      cursor: pointer;
      transition: opacity .5s ease, transform .5s ease;
    }
    .guest-banner.is-gone { opacity: 0; pointer-events: none; }

    /* تلميح التدوير — لا يظهر إلا على هاتف عمودي */
    .rotate-hint {
      display: none;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(98px + env(safe-area-inset-bottom));
      width: max-content;
      max-width: calc(100vw - 32px);
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 14px;
      background: rgba(18, 14, 33, 0.85);
      border: 1px solid rgba(157, 54, 246, 0.45);
      color: #e5d8ff;
      font-size: 13px;
      font-weight: 700;
      z-index: 5;
    }
    .rotate-hint__icon { font-size: 22px; display: inline-block; animation: la-rotate 2.4s ease-in-out infinite; }
    @keyframes la-rotate { 0%, 55%, 100% { transform: rotate(0); } 70%, 90% { transform: rotate(-90deg); } }

    /* الهاتف العمودي: الماكينة أفقية التصميم فتأخذ أعلى الشاشة وحده. الشريط
       ينزل إلى الفراغ تحتها بدل أن يغطّي صفّ البكرات الأعلى، ويظهر تلميح
       التدوير — بالعرض تملأ الماكينة الشاشة. */
    @media (max-width: 700px) and (orientation: portrait) {
      .guest-banner { top: auto; bottom: calc(24px + env(safe-area-inset-bottom)); border-radius: 14px; }
      .rotate-hint { display: flex; }
    }
    /* الهاتف بالعرض: لا فراغ — الشريط صغير في الزاوية ويختفي سريعاً */
    @media (orientation: landscape) and (max-height: 540px) {
      .guest-banner { top: 56px; left: auto; right: 10px; transform: none; font-size: 11px; padding: 6px 12px; max-width: 46vw; border-radius: 12px; }
    }
    .guest-banner a {
      color: var(--gold);
      text-decoration: underline;
      font-weight: 800;
    }

    /* ─── التنبيهات المنبثقة Toast ─── */
    .la-toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .la-toast {
      background: rgba(22, 10, 36, 0.95);
      border: 1px solid var(--gold);
      color: #fff;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.8);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: auto;
      text-align: center;
      direction: rtl;
    }
    .la-toast--error {
      border-color: #ff3366;
      background: rgba(45, 10, 22, 0.96);
      color: #ffb3c6;
    }
    .la-toast--success {
      border-color: #00ffaa;
      background: rgba(10, 40, 25, 0.96);
      color: #b3ffe0;
    }

    @media (max-width: 600px) {
      .la-topbar {
        padding: 0 10px;
        height: 48px;
      }
      .la-game-title span {
        display: none;
      }
      .la-wallet {
        padding: 4px 10px;
      }
      .la-wallet__val {
        font-size: 13px;
      }
      #slot-machine {
        height: calc(100vh - 48px);
      }
      /* الموضع يحدّده قسما الهاتف العمودي/الأفقي أعلاه — ضبط top هنا كان
         يجتمع مع bottom هناك فيتمدّد الشريط بطول الشاشة */
      .guest-banner {
        font-size: 11px;
        padding: 7px 12px;
      }
    }
  </style>
</head>

<div class="rotate-hint" aria-hidden="true"><span class="rotate-hint__icon">📱</span><span>أدِر هاتفك لشاشة أكبر</span></div>

  <script>
    'use strict';

    /* ══════════════ نظام التنبيهات Toast ══════════════ */
    function toast(msg, type) {
      var container = document.getElementById('laToastContainer');
      if (!container) return;
      var el = document.createElement('div');
      el.className = 'la-toast' + (type === 'error' ? ' la-toast--error' : type === 'success' ? ' la-toast--success' : '');
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(function() {
        el.style.opacity = '0';
        el.style.transform = 'translateY(10px)';
        setTimeout(function() { el.remove(); }, 300);
      }, 3500);
    }

    /* ══════════════ مراقبة تحميل اللعبة ══════════════ */
    (function () {
      var PAINTING_TIMEOUT_MS = 30000;
      var root = document.getElementById('slot-machine');
      var spentPainting = 0;
      var lastTick = Date.now();

      var framePending = false;
      var framesSinceTick = 0;
      function armFrame() {
        if (framePending) return;
        framePending = true;
        requestAnimationFrame(function () { framePending = false; framesSinceTick++; });
      }
      armFrame();

      function isLoaded() {
        return root.classList.contains('smg-loaded');
      }

      function hidePreloader() {
        var p = root.querySelector('.smg-preloader');
        if (p) p.style.display = 'none';
      }

      function showFailure() {
        hidePreloader();
        if (root.querySelector('.la-loadfail')) return;
        var box = document.createElement('div');
        box.className = 'la-loadfail';
        box.setAttribute('dir', 'rtl');
        box.innerHTML =
          '<b>تعذّر تحميل اللعبة</b>' +
          '<small>قد يكون الاتصال بطيئاً أو انقطع تحميل أحد الملفات.</small>';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'إعادة المحاولة';
        btn.addEventListener('click', function () { location.reload(); });
        box.appendChild(btn);
        root.appendChild(box);
      }

      var timer = setInterval(function () {
        var now = Date.now();
        var painting = !document.hidden && framesSinceTick > 0;
        if (painting) spentPainting += now - lastTick;
        framesSinceTick = 0;
        lastTick = now;
        armFrame();

        if (isLoaded()) {
          clearInterval(timer);
          hidePreloader();
        } else if (spentPainting > PAINTING_TIMEOUT_MS) {
          clearInterval(timer);
          showFailure();
        }
      }, 400);
    })();

    /* ══════════════ ربط المحفظة والدوران الحقيقي بالسيرفر ══════════════ */
    (function () {
      var token = '';
      try {
        token = localStorage.getItem('ichance.token') || localStorage.getItem('ichance_token') || '';
      } catch (e) { token = ''; }

      var balEl = document.getElementById('laBalance');
      var curEl = document.getElementById('laCurrency');
      var bannerEl = document.getElementById('guestBanner');
      var depositBtn = document.getElementById('laDepositBtn');

      var currentBalance = 0;
      var currentCurrency = 'IQD';
      var machineInstance = null;
      var isSpinActive = false;
      var pendingSpinPromise = null;

      function fmt(n) {
        return Math.floor(n || 0).toLocaleString('en-US');
      }

      // يُعرض مرّة لكل حالة (حقيقي/تجريبي)، ويختفي بعد ثوانٍ أو بلمسة.
      // كان يُعاد إظهاره مع كل مزامنة للرصيد (كل 8 ثوانٍ) فوق البكرات.
      var bannerShown = '';
      var bannerTimer = null;
      function banner(html) {
        if (bannerShown === html) return;
        bannerShown = html;
        bannerEl.innerHTML = html;
        bannerEl.classList.remove('is-gone');
        bannerEl.style.display = 'flex';
        clearTimeout(bannerTimer);
        bannerTimer = setTimeout(function () { bannerEl.classList.add('is-gone'); }, 6000);
      }
      bannerEl.addEventListener('click', function (e) {
        if (e.target.tagName !== 'A') bannerEl.classList.add('is-gone');
      });

      function updateStatusBanner() {
        if (token) {
          banner('<span>💎 أنت تلعب الآن برصيدك الحقيقي — الرهانات والأرباح مرتبطة بمحفظتك مباشرة.</span>');
        } else {
          banner('<span>⚡ وضع تجريبي للتسلية. </span>'
               + '<a href="/login?next=/neon-slots">سجّل دخولك</a>'
               + '<span> للّعب برصيدك الحقيقي وسحب الأرباح.</span>');
        }
      }

      async function initSessionIfGuest() {
        if (!token) {
          try {
            var res = await fetch('/api/session', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: '{}'
            });
            if (res.ok) {
              var data = await res.json();
              if (data && data.token) {
                token = data.token;
                try { localStorage.setItem('ichance.token', token); } catch (e) {}
                syncWallet();
              }
            }
          } catch (e) {
            console.warn('[NeonSlots] Guest session init failed:', e);
          }
        }
      }

      var reelsChecked = false;

      async function syncWallet() {
        if (!token) {
          balEl.textContent = '10,000';
          curEl.textContent = 'DEMO';
          updateStatusBanner();
          return;
        }
        try {
          var res = await fetch('/api/neon-slots/state', { headers: { 'x-player-token': token } });
          if (res.ok) {
            var data = await res.json();
            // الخادم يقرّر مواضع التوقّف وهذه الصفحة ترسمها بأشرطتها — لو
            // اختلفت الأشرطة لعُرضت رموز غير التي حُسب عليها الربح.
            if (data.reels && !reelsChecked) {
              reelsChecked = true;
              if (JSON.stringify(data.reels) !== JSON.stringify(window.slotMachineConfig.reels)) {
                console.error('[NeonSlots] أشرطة الصفحة لا تطابق أشرطة الخادم — '
                  + 'الرموز المعروضة لن تطابق الربح المحسوب. أعِد توليدها بـ tools/applyNeon.js');
              }
            }
            if (data.player) {
              currentBalance = Number(data.player.balance) || 0;
              currentCurrency = data.player.currency || 'IQD';
              balEl.textContent = fmt(currentBalance);
              curEl.textContent = currentCurrency;

              if (machineInstance) {
                machineInstance.balance = currentBalance;
                machineInstance.updateUIText();
              }
              if (depositBtn) {
                if (currentBalance < 1000) {
                  depositBtn.innerHTML = 'ضاعف رصيدك الآن 🎁';
                  depositBtn.style.animation = 'pulse 1.5s infinite';
                } else {
                  depositBtn.innerHTML = '+ شحن';
                  depositBtn.style.animation = 'none';
                }
              }
              updateStatusBanner();
            }
          } else if (res.status === 401) {
            token = '';
            balEl.textContent = '10,000';
            curEl.textContent = 'DEMO';
            updateStatusBanner();
          }
        } catch (err) {
          console.warn('[NeonSlots] Wallet sync error:', err.message);
        }
      }

      updateStatusBanner();
      initSessionIfGuest().then(syncWallet);
      setInterval(syncWallet, 10000);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) syncWallet();
      });

      // ─── استقبال كائن ماكينة السلوتس عند اكتمال جاهزيتها ───
      window.onNeonSlotsReady = function(game) {
        machineInstance = game;
        console.log('[NeonSlots] Machine ready. Binding server-side spin engine.');

        game.min_bet = 200;
        game.max_bet = 8000;
        game.bet_change_amount = 200;
        if (!game.bet || game.bet < 200 || game.bet > 8000 || game.bet % 200 !== 0) {
          game.bet = 200;
        }

        if (token && currentBalance > 0) {
          game.balance = currentBalance;
        }
        game.updateUIText();

        // ─── إيقاف البكرات ───
        // المحرّك لا يوقف البكرة إلا حين يمرّ الهدف أمامها وهي تدور، رمزاً كل
        // 80ms. أشرطتنا 65–68 رمزاً (ضبط نسبة الربح)، فقد تحتاج البكرة 5 ثوانٍ
        // لتبلغ هدفها. الحارس القديم كان يقطعها بعد 2.2 ثانية ويصفّر سرعتها
        // تاركاً إطار الحركة المموّه (speed_frame) — فتُعلَن النتيجة وعمود ما
        // يزال يبدو دائراً، وفي كل جولة عمود مختلف.
        // الحل كما في ماكينات السلوتس: لحظة طلب التوقّف والبكرة بأقصى سرعتها
        // (الرموز مموّهة فلا يُرى القفز) يوضع الهدف على بُعد STOP_LEAD رموز،
        // فتتباطأ وتقف عليه بحركتها الطبيعية في أقل من ثانية، أيّاً كان طول الشريط.
        var STOP_LEAD = 3;
        var REEL_WATCHDOG_MS = 3000;

        // حالة البكرة الواقفة كما يتركها المحرّك نفسه — ومنها speed_frame=0،
        // وإلا بقيت ترسم الإطار المموّه وهي واقفة. تُرجع: هل كانت تتحرّك؟
        function settleReel(r, target) {
          var wasMoving = r.speed > 0 || r.is_spin || r.is_stopping || r.is_spinning;
          if (typeof target === 'number') r.position = target;
          r.speed = 0;
          r.speed_frame = 0;
          r.delta = 0;
          r.delta_stop = 0;
          r.is_spin = false;
          r.is_stopping = false;
          r.is_spinning = false;
          return wasMoving;
        }

        if (game.reels) {
          game.reels.forEach(function(reel, rIdx) {
            var origStop = reel.stopSpin;
            reel.stopSpin = function(rawTarget) {
              var len = (reel.ids && reel.ids.length) ? reel.ids.length : 1;
              var target = ((Math.floor(Number(rawTarget) || 0) % len) + len) % len;

              // المحرّك يبدأ التباطؤ حين position - delta_pos_stop == الهدف، ثم
              // يقطع delta_pos_stop رموزاً أخرى فيقف على position == الهدف.
              if (reel.is_spin && !reel.is_stopping) {
                reel.position = reel.getReelPosition(target + reel.delta_pos_stop + STOP_LEAD);
              }
              origStop(target);

              // احتياط فقط — حين لا يُرسم شيء (تبويب في الخلفية): تثبيت نظيف على الهدف
              clearTimeout(reel.__watchdogTimer);
              reel.__watchdogTimer = setTimeout(function() {
                if (settleReel(reel, target)) {
                  console.warn('[NeonSlots] Watchdog settled reel ' + rIdx + ' at ' + target);
                  if (typeof reel.onstopped === 'function') reel.onstopped(reel);
                }
              }, REEL_WATCHDOG_MS);
            };

            var origStart = reel.startSpin;
            reel.startSpin = function() {
              clearTimeout(reel.__watchdogTimer);
              origStart();
            };
          });
        }

        // ما يُعرض بعد أن تقف كل البكرات فعلاً (لا بعد مهلة تخمينية)
        var afterResult = null;
        var origShowResult = game.gameshowresult;
        game.gameshowresult = function() {
          origShowResult.apply(game, arguments);
          var fn = afterResult;
          afterResult = null;
          // يُستدعى من داخل حلقة الرسم — خطأ هنا لا يجوز أن يوقفها
          if (fn) { try { fn(); } catch (e) { console.error('[NeonSlots]', e); } }
        };

        // نتيجة بلا ربح تعرض رسالة بدل نتيجة الجولة السابقة
        function errorResult(text) {
          return {
            error: text,
            win: 0,
            gameable: { scatters_count: 0, lines_win: 0, win_lines: {}, win_lines_ttl: {}, win_scatters: [[], [], [], [], []] },
            account: { balance: currentBalance }
          };
        }
        var spinSafetyTimer = null;

        // ربط حدث اكتمال تسارع البكرة الأخيرة بطلب النتيجة من الخادم
        if (game.reels && game.reels[4]) {
          game.reels[4].onspinned = function() {
            if (typeof game.game_result_request === 'function') {
              game.game_result_request();
            }
          };
        }

        // اعتراض نقرة زر الدوران (Spin Button)
        var origSpinClick = game.btn_spin_click.bind(game);

        game.btn_spin_click = function() {
          if (isSpinActive) return;

          // 1. إذا كان زائر غير مسجل
          if (!token) {
            toast('يرجى تسجيل الدخول للّعب بالرصيد الحقيقي', 'info');
            window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
            return;
          }

          var rawBet = Math.floor(Number(game.bet) || 200);
          var totalBet = Math.max(200, Math.min(8000, Math.round(rawBet / 200) * 200));

          // 2. التحقق من كفاية الرصيد الحقيقي
          if (currentBalance < totalBet) {
            toast('رصيدك لا يكفي لإتمام هذه الدورة (الرهان: ' + fmt(totalBet) + ' ' + currentCurrency + '). يرجى شحن الرصيد للمتابعة.', 'error');
            return;
          }

          isSpinActive = true;

          // حارس عام: لم يصل طلب النتيجة أصلاً (البكرات لم تبلغ سرعتها لأن
          // التبويب في الخلفية). يُلغى حين تصل النتيجة — كان لا يُلغى أبداً،
          // فيضرب الجولة التالية إن بدأت خلال 6 ثوانٍ ويوقفها في منتصفها.
          clearTimeout(spinSafetyTimer);
          spinSafetyTimer = setTimeout(function() {
            spinSafetyTimer = null;
            if (!isSpinActive) return;
            console.warn('[NeonSlots] Global spin timeout watchdog triggered');
            isSpinActive = false;
            pendingSpinPromise = null;
            game.game_result = errorResult('تعذّر إكمال الدورة — تم تحديث رصيدك');
            var moving = (game.reels || []).filter(function(r) { return settleReel(r); });
            moving.forEach(function(r) {
              if (typeof r.onstopped === 'function') r.onstopped(r);
            });
            syncWallet();
          }, 6000);

          // 3. خصم الرهان فوراً من رصيد اللاعب وتحديث الشريط العلوي
          currentBalance -= totalBet;
          balEl.textContent = fmt(currentBalance);
          game.balance = currentBalance;
          game.updateUIText();

          // 4. إرسال طلب الدوران الحقيقي المشفر للخادم ذرياً مع مهلة أمان
          var networkPromise = fetch('/api/neon-slots/spin', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-player-token': token
            },
            body: JSON.stringify({
              bet: totalBet,
              lines: 20
            })
          }).then(function(res) {
            return res.json();
          }).catch(function(err) {
            console.error('[NeonSlots] Spin network error:', err);
            return { ok: false, error: 'تعذّر الاتصال بالخادم' };
          });

          var timeoutPromise = new Promise(function(resolve) {
            setTimeout(function() {
              resolve({ ok: false, error: 'انتهت مهلة استجابة الخادم' });
            }, 4500);
          });

          pendingSpinPromise = Promise.race([networkPromise, timeoutPromise]);

          // 5. إطلاق الرسوميات والمؤثرات الصوتية للدوران فوراً
          origSpinClick();
          // مزامنة رصيد الماكينة مع رصيد المحفظة الفعلي بعد الخصم فوراً
          game.balance = currentBalance;
          game.updateUIText();
        };

        // اعتراض مرحلة التوقف وتحديد النتيجة (game_result_request)
        game.game_result_request = async function() {
          // إذا كان زائر تجريبي (بدون توكن)، يُترك المحرك المحلي يحدد التوقف
          if (!token || !pendingSpinPromise) {
            var localStops = game.reels.map(function(r) {
              var len = (r.ids && r.ids.length) ? r.ids.length : 20;
              return Math.floor(Math.random() * len);
            });
            game.game_result = errorResult('');
            for (var i = 0; i < 5; i++) {
              (function(idx) {
                setTimeout(function() {
                  if (game.reels && game.reels[idx]) game.reels[idx].stopSpin(localStops[idx]);
                }, idx * 220);
              })(i);
            }
            return;
          }

          var result = null;
          try {
            result = await pendingSpinPromise;
          } catch(e) {
            result = null;
          }
          pendingSpinPromise = null;
          clearTimeout(spinSafetyTimer);
          spinSafetyTimer = null;

          if (!result || !result.ok) {
            toast(result && result.error ? result.error : 'فشل تنفيذ الدورة، تم إرجاع الرهان', 'error');
            isSpinActive = false;
            // استرجاع الرهان فوراً
            var rawBetFail = Math.floor(Number(game.bet) || 200);
            var betToRefund = Math.max(200, Math.min(8000, Math.round(rawBetFail / 200) * 200));
            currentBalance += betToRefund;
            game.balance = currentBalance;
            game.updateUIText();
            balEl.textContent = fmt(currentBalance);
            // بلا هذا تعرض الماكينة نتيجة الجولة السابقة وخطوط ربحها
            game.game_result = errorResult('لم تُحتسب الدورة');
            for (var r = 0; r < 5; r++) {
              if (game.reels && game.reels[r]) game.reels[r].stopSpin(0);
            }
            syncWallet();
            return;
          }

          // تحديث الرصيد الحقيقي في المحفظة
          currentBalance = result.balance;
          balEl.textContent = fmt(currentBalance);

          // إعداد كائن النتيجة بالقيم الواردة من السيرفر
          var rawStops = result.stops || [0, 0, 0, 0, 0];
          var stops = rawStops.map(function(val, idx) {
            var r = (game.reels && game.reels[idx]);
            var stripLen = (r && r.ids && r.ids.length) ? r.ids.length : 20;
            return Math.abs(Math.floor(Number(val) || 0)) % stripLen;
          });

          game.game_result = {
            gameable: {
              reel_positions: stops.join(','),
              // المحرّك يعرض «N scatters — Win X» متى كان العدد > 0؛ والخادم يرسل
              // العدد الخام، فظهر «2 scatters Win 0». يُحسب فقط حين تربح.
              scatters_count: (result.scatterWin > 0) ? (result.scatterCount || 0) : 0,
              win_scatters_ttl: result.scatterWin || 0,
              // والخادم يرسل مواضعها دائماً، فكانت تومض كأنها ربحت
              win_scatters: (result.scatterWin > 0 && result.gameable && result.gameable.win_scatters) ? result.gameable.win_scatters : [[],[],[],[],[]],
              lines_win: result.linesWinCount || 0,
              win_lines_ttl: result.winningLines || {},
              win_lines: (result.gameable && result.gameable.win_lines) ? result.gameable.win_lines : {}
            },
            win: result.win || 0,
            account: {
              balance: result.balance
            }
          };

          // يُنفَّذ حين تقف البكرة الأخيرة فعلاً وتُعرض النتيجة
          afterResult = function() {
            game.balance = currentBalance;
            game.updateUIText();
            balEl.textContent = fmt(currentBalance);
            // (كان يقسم على totalBet، وهو متغيّر محلي في دالة الزر لا يُرى هنا —
            // فيرمي خطأً عند كل ربح ولا تظهر رسالة الفوز)
            var spinBet = Number(result.bet) || Number(game.bet) || 200;
            if (result.win > 0) {
              var mult = result.win / spinBet;
              if (mult >= 5) {
                toast('ضربة حظ أسطورية! 🔥 هل تجرؤ على زيادة الرهان؟', 'success');
              } else {
                toast('فوز رائع! استمر في الدوران 🎰', 'success');
              }
            }
          };

          // إيقاف البكرات بالترتيب؛ كل واحدة تقف على موضعها خلال أقل من ثانية
          for (var rIdx = 0; rIdx < 5; rIdx++) {
            (function(idx) {
              setTimeout(function() {
                if (game.reels && game.reels[idx]) {
                  game.reels[idx].stopSpin(stops[idx]);
                }
                if (idx === 4) isSpinActive = false;
              }, idx * 220);
            })(rIdx);
          }
        };
      };

      // إذا كانت ماكينة السلوتس قد اكتمل تحميلها بالفعل قبل هذا السكربت
      if (window.__neonSlotInstance && typeof window.onNeonSlotsReady === 'function') {
        window.onNeonSlotsReady(window.__neonSlotInstance);
      }

      // زر ملء الشاشة
      var fsBtn = document.getElementById('laFullscreenBtn');
      if (fsBtn) {
        fsBtn.addEventListener('click', function () {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(function () {});
            fsBtn.textContent = '✖';
          } else {
            document.exitFullscreen().catch(function () {});
            fsBtn.textContent = '⛶';
          }
        });
      }

      // زر الشحن السريع
      var depBtn = document.getElementById('laDepositBtn');
      if (depBtn) {
        depBtn.addEventListener('click', function (e) {
          e.preventDefault();
          window.location.href = '/?action=deposit';
        });
      }
    })();
  </script>
</body>
</html>
