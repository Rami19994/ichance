<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>نيون فيغاس سلوتس — LuckyArena</title>
  <meta name="description" content="ماكينة سلوتس كلاسيكية 5 بكرات بنمط نيون جذاب، 20 خط دفع، رموز Scatter و Wild ومضاعفات فورية." />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

  <!-- كل مسارات اللعبة النسبية تُحلّ من مجلّدها -->
  <base href="/games/neon-slots/" />
  <link rel="stylesheet" href="assets/css/main.css" />

  <script>
    /**
     * إعدادات اللعبة — يجب أن تُعرَّف قبل تحميل main.js.
     *
     * ⚠ `balance` هنا رصيد **داخل اللعبة** لا علاقة له بمحفظة اللاعب على
     * الموقع. اللعبة مغلقة المصدر وتحسب نتائجها في المتصفح، فلا يجوز أن
     * تُصرَف منها أموال حقيقية. المحفظة في الشريط العلوي للعرض فقط.
     */
    window.slotMachineConfig = {
      minBet: 1,
      maxBet: 100,
      defaultBet: 1,
      betChangeAmount: 1,
      lineCount: 20,
      balance: 1000
    };

    /**
     * اللعبة تحفظ رصيدها التجريبي في localStorage تحت smg-balance، وقيمة
     * `balance` أعلاه تُستعمل أوّل مرّة فقط. فإن نفد الرصيد بقي صفراً إلى
     * الأبد وردّت على كل ضغطة «Insufficient balance» بلا أي طريق للخروج.
     * نعيد تعبئته ما دام تجريبياً — لا شيء حقيقي يُفقد.
     */
    (function () {
      try {
        var SPIN_FLOOR = 20;   // أقل رهان (1) × 20 خطاً = دورة واحدة
        var saved = parseInt(localStorage.getItem('smg-balance'), 10);
        if (!isFinite(saved) || saved < SPIN_FLOOR) {
          localStorage.setItem('smg-balance', String(window.slotMachineConfig.balance));
        }
      } catch (e) { /* تخزين محجوب: اللعبة تبدأ من قيمة الإعدادات */ }
    })();

    /*
     * ⚠ لا تضف هنا أي تعديل على HTMLImageElement.prototype.
     *
     * كان هنا «إصلاح» عامّ يعترض src وonload لكل الصور ويستدعي onload
     * يدوياً بعد 50ms. وهو نفسه سبب تجمّد «LOADING…100%»:
     *
     *   • خاصية onload ليست ملكاً لـHTMLImageElement.prototype بل
     *     لـHTMLElement.prototype، فشرط `if (origOnloadDesc)` كان يفشل
     *     بصمت وتبقى راية _onloadFired غير معرّفة أبداً — فيُستدعى
     *     onload يدوياً **فوق** الحدث الحقيقي: مرّتان لكل صورة (مُقاس).
     *   • ومحمّل اللعبة متسلسل: كل onload يزيد العدّاد ويجدول الخطوة
     *     التالية. فمضاعفة الاستدعاء تُفرّع سلسلة التحميل إلى سلسلتين ثم
     *     أربع… قياساً: 621 خطوة تحميل بدل 180.
     *
     * وحُصِّن محمّل الخلفية داخل الحزمة نفسها (onerror + راية خطوة واحدة)،
     * والتفصيل في games/neon-slots/PATCH-LUCKYARENA.md.
     */
  </script>

  <!--
    مكتبات CreateJS يحمّلها main.js بنفسه ديناميكياً — أُزيلت وسوم التحميل
    المسبق هنا لأنها كانت تحمّلها مرّة ثانية، وتحميل soundjs مرّتين يعيد
    تعريف createjs.Sound وقد يمسح الأصوات المسجَّلة.
  -->
  <script src="assets/js/main.js"></script>

  <style>
    :root {
      --gold: #f5c542;
      --gold-dark: #b8860b;
      --neon-purple: #9d36f6;
      --neon-pink: #ff2d87;
      --bg: #07080f;
      --panel: rgba(18, 14, 33, 0.95);
      --border: rgba(245, 197, 66, 0.25);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    /* ─── الشريط العلوي الفاخر ─── */
    .la-topbar {
      position: relative;
      z-index: 100;
      flex: 0 0 auto;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: linear-gradient(90deg, #100a20 0%, #1c0d38 50%, #0d071a 100%);
      border-bottom: 1px solid rgba(245, 197, 66, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .la-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .la-btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e5d8ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .la-btn-back:hover {
      background: rgba(245, 197, 66, 0.2);
      border-color: var(--gold);
      color: #fff;
      transform: translateX(2px);
    }

    .la-game-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 15px;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .la-game-title span {
      background: linear-gradient(135deg, #fff 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .la-badge-neon {
      background: linear-gradient(135deg, #7928ca, #ff0080);
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(255, 0, 128, 0.4);
    }

    .la-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .la-wallet {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(245, 197, 66, 0.35);
      padding: 5px 14px;
      border-radius: 999px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .la-wallet__lbl {
      font-size: 11px;
      color: #a89bb9;
      font-weight: 600;
    }
    .la-wallet__val {
      font-size: 15px;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 8px rgba(245, 197, 66, 0.3);
      letter-spacing: 0.02em;
    }
    .la-wallet__cur {
      font-size: 11px;
      font-weight: 700;
      color: #e5d8ff;
      background: rgba(255, 255, 255, 0.1);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .la-btn-deposit {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
      color: #0b0714;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(245, 197, 66, 0.3);
      transition: all 0.2s ease;
    }
    .la-btn-deposit:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .la-btn-icon {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e5d8ff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .la-btn-icon:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }

    /* ─── حاوية اللعبة ─── */
    #slot-machine {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      height: calc(100vh - 52px);
      position: relative;
    }

    /* ─── رسالة تعذّر التحميل بدل شاشة متجمّدة ─── */
    .la-loadfail {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      background: #1e053d;
      color: #fff;
      font-size: 14px;
      line-height: 1.9;
    }
    .la-loadfail b { font-size: 17px; }
    .la-loadfail small { color: #b9a8d6; }
    .la-loadfail button {
      background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
      color: #0b0714;
      border: none;
      border-radius: 10px;
      padding: 10px 26px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    /* ─── شريط التنبيه ─── */
    .guest-banner {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 24px);
      background: rgba(18, 14, 33, 0.95);
      border: 1px solid var(--gold);
      color: #fff;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      pointer-events: auto;
    }
    .guest-banner a {
      color: var(--gold);
      text-decoration: underline;
      font-weight: 800;
    }

    @media (max-width: 600px) {
      .la-topbar {
        padding: 0 10px;
        height: 48px;
      }
      .la-game-title span {
        display: none;
      }
      .la-wallet {
        padding: 4px 10px;
      }
      .la-wallet__val {
        font-size: 13px;
      }
      #slot-machine {
        height: calc(100vh - 48px);
      }
      .guest-banner {
        top: 56px;
        font-size: 11px;
        padding: 7px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- ─── الشريط العلوي ─── -->
  <header class="la-topbar">
    <div class="la-left">
      <a href="/" class="la-btn-back" title="الرجوع إلى كازينو LuckyArena">
        <span>←</span>
        <span>الردهة</span>
      </a>
      <div class="la-game-title">
        <span>نيون فيغاس</span>
        <span class="la-badge-neon">5 REELS</span>
      </div>
    </div>

    <div class="la-right">
      <div class="la-wallet">
        <span class="la-wallet__lbl">الرصيد:</span>
        <span class="la-wallet__val" id="laBalance">—</span>
        <span class="la-wallet__cur" id="laCurrency">IQD</span>
      </div>
      <a href="/" class="la-btn-deposit" id="laDepositBtn" title="شحن الرصيد">+ شحن</a>
      <button class="la-btn-icon" id="laFullscreenBtn" title="ملء الشاشة">⛶</button>
    </div>
  </header>

  <!-- ─── ماكينة اللعب — ltr لأن تخطيطها الداخلي مبني على اليسار ─── -->
  <div id="slot-machine" dir="ltr"></div>

  <!-- تنبيه حالة اللعب -->
  <div id="guestBanner" class="guest-banner"></div>

  <script>
    'use strict';

    /* ══════════════ مراقبة تحميل اللعبة ══════════════
     * اللعبة تضيف الصنف smg-loaded على حاويتها عند انتهاء التحميل.
     * نخفي شاشة التحميل عندها، وإن لم تنتهِ خلال مهلة معقولة نعرض رسالة
     * وزرّ إعادة محاولة بدل شاشة متجمّدة لا يفهمها اللاعب.
     *
     * المهلة لا تُحسب بالوقت الجاري بل بالوقت الذي كان المتصفّح فيه **يرسم
     * فعلاً**: محمّل اللعبة يتقدّم خطوةً في كل إطار رسم، والمتصفّح يجمّد
     * الإطارات في التبويب الخلفي وحتى في نافذة مغطّاة بالكامل — بينما تبقى
     * document.hidden تساوي false. فالاكتفاء بها يتّهم اللعبة بالفشل وهي
     * سليمة. لذلك نتحقّق في كل نبضة أن إطاراً قد سُلِّم؛ وإلّا فالمتصفّح هو
     * المتوقّف لا اللعبة، فلا نعدّ تلك الفترة.
     */
    (function () {
      var PAINTING_TIMEOUT_MS = 30000;
      var root = document.getElementById('slot-machine');
      var spentPainting = 0;
      var lastTick = Date.now();

      var framePending = false;
      var framesSinceTick = 0;
      function armFrame() {
        if (framePending) return;
        framePending = true;
        requestAnimationFrame(function () { framePending = false; framesSinceTick++; });
      }
      armFrame();

      function isLoaded() {
        return root.classList.contains('smg-loaded');
      }

      function hidePreloader() {
        var p = root.querySelector('.smg-preloader');
        if (p) p.style.display = 'none';
      }

      function showFailure() {
        hidePreloader();
        if (root.querySelector('.la-loadfail')) return;
        var box = document.createElement('div');
        box.className = 'la-loadfail';
        box.setAttribute('dir', 'rtl');
        box.innerHTML =
          '<b>تعذّر تحميل اللعبة</b>' +
          '<small>قد يكون الاتصال بطيئاً أو انقطع تحميل أحد الملفات.</small>';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'إعادة المحاولة';
        btn.addEventListener('click', function () { location.reload(); });
        box.appendChild(btn);
        root.appendChild(box);
      }

      var timer = setInterval(function () {
        var now = Date.now();
        var painting = !document.hidden && framesSinceTick > 0;
        if (painting) spentPainting += now - lastTick;
        framesSinceTick = 0;
        lastTick = now;
        armFrame();

        if (isLoaded()) {
          clearInterval(timer);
          hidePreloader();
        } else if (spentPainting > PAINTING_TIMEOUT_MS) {
          clearInterval(timer);
          showFailure();
        }
      }, 400);
    })();

    /* ══════════════ الشريط العلوي والمحفظة ══════════════ */
    (function () {
      var token = '';
      try { token = localStorage.getItem('ichance.token') || ''; } catch (e) { token = ''; }

      var balEl = document.getElementById('laBalance');
      var curEl = document.getElementById('laCurrency');
      var bannerEl = document.getElementById('guestBanner');

      function fmt(n) {
        return Math.floor(n || 0).toLocaleString('en-US');
      }

      function banner(html) {
        bannerEl.innerHTML = html;
        bannerEl.style.display = 'flex';
      }

      /**
       * ⚠ هذه اللعبة تحسب نتائجها في المتصفح ولا تنادي الخادم.
       * فالرهان لا يُخصم من المحفظة والربح لا يُضاف إليها — أرقام اللعبة
       * أرصدة تجريبية. الشريط العلوي يعرض المحفظة الحقيقية للاطمئنان، وهي
       * لا تتغيّر باللعب هنا. نقول ذلك للّاعب صراحةً بدل أن يكتشفه بنفسه.
       */
      function markDemo(loggedIn) {
        if (loggedIn) {
          banner('<span>🎲 هذه اللعبة للتسلية برصيد تجريبي — لا يُخصم من محفظتك ولا يُضاف إليها.</span>');
        } else {
          banner('<span>⚡ أنت تلعب الآن في الوضع التجريبي.</span>'
               + '<a href="/login">سجّل دخولك</a>'
               + '<span>لرؤية محفظتك.</span>');
        }
      }

      async function syncWallet() {
        if (!token) {
          balEl.textContent = '1,000';
          curEl.textContent = 'DEMO';
          return;
        }
        try {
          var res = await fetch('/api/me', { headers: { 'x-player-token': token } });
          if (res.ok) {
            var data = await res.json();
            if (data.player) {
              balEl.textContent = fmt(data.player.balance);
              curEl.textContent = data.player.currency || 'IQD';
            }
          } else if (res.status === 401) {
            balEl.textContent = '1,000';
            curEl.textContent = 'DEMO';
            markDemo(false);
          }
        } catch (err) {
          console.warn('[NeonSlots] تعذّرت مزامنة المحفظة:', err.message);
        }
      }

      markDemo(!!token);
      syncWallet();
      setInterval(syncWallet, 8000);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) syncWallet();
      });

      var fsBtn = document.getElementById('laFullscreenBtn');
      if (fsBtn) {
        fsBtn.addEventListener('click', function () {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(function () {});
            fsBtn.textContent = '✖';
          } else {
            document.exitFullscreen().catch(function () {});
            fsBtn.textContent = '⛶';
          }
        });
      }

      var depBtn = document.getElementById('laDepositBtn');
      if (depBtn) {
        depBtn.addEventListener('click', function (e) {
          e.preventDefault();
          window.location.href = '/?action=deposit';
        });
      }
    })();
  </script>
</body>
</html>
