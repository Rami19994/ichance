<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة المالك — iCHANCE</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; padding: 24px;
    background: radial-gradient(circle at 50% 20%, #151d2a 0%, #070b11 80%);
    color: #e9eef8;
    font-family: Tajawal, system-ui, sans-serif;
  }
  .box {
    width: min(450px, 100%);
    background: linear-gradient(160deg, #121a25, #0c131c);
    border: 1px solid #1e2836;
    border-radius: 20px;
    padding: 34px 28px 26px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.7);
  }
  .lock {
    width: 64px; height: 64px; margin: 0 auto 16px;
    display: grid; place-items: center; font-size: 32px;
    background: linear-gradient(145deg, #2a2311, #181409);
    border: 1px solid #4a3c1c; border-radius: 18px;
    box-shadow: 0 8px 24px rgba(245,197,66,.15);
  }
  h1 { margin: 0 0 10px; font-size: 22px; font-weight: 900; color: #fff; }
  p { margin: 0 0 24px; color: #8b99b0; font-size: 13.5px; line-height: 1.8; }
  button {
    width: 100%; padding: 14px;
    border: 0; border-radius: 12px;
    font-family: inherit; font-size: 15px; font-weight: 900;
    cursor: pointer;
    background: linear-gradient(180deg, #ffeaa7, #f7c948 45%, #d99a0b);
    color: #241a03;
    transition: transform .15s, opacity .15s;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .ghost {
    margin-top: 12px; background: #161e2b; color: #b6c1d4;
    border: 1px solid #253040; font-size: 13.5px; font-weight: 700;
  }
  .ghost:hover { background: #1d2838; }
  .out {
    margin-top: 18px; padding: 14px;
    border-radius: 12px; font-size: 13px; line-height: 1.8;
    display: none; text-align: start;
  }
  .out.ok  { display: block; background: rgba(41,217,140,.12); border: 1px solid rgba(41,217,140,.35); color: #b9f5da; }
  .out.bad { display: block; background: rgba(255,91,115,.12); border: 1px solid rgba(255,91,115,.35); color: #ffc0cb; }
  code {
    display: block; margin-top: 8px; padding: 10px;
    background: rgba(0,0,0,.5); border-radius: 8px;
    color: #ffd875; font-size: 14px; font-weight: 700;
    word-break: break-all; direction: ltr; text-align: left;
  }
  .warn {
    margin-top: 24px; color: #6b7a92; font-size: 11.5px; line-height: 1.8;
    border-top: 1px solid #1a2230; padding-top: 16px;
  }
</style>
</head>
<body>

<div class="box">
  <div class="lock">🔐</div>
  <h1>بوابة مالك المنصة السرّية</h1>
  <p>هذا الرابط خاص بمالك الموقع وحده ومحجوب عن الجميع. اضغط لتوليد مفتاح إدارة جديد والدخول مباشرة للوحة التحكم.</p>

  <button type="button" id="go">توليد مفتاح الإدارة والدخول</button>
  <button type="button" class="ghost" id="rot">تغيير هذا الرابط السري</button>

  <div class="out" id="out"></div>

  <div class="warn">
    🔒 <b>ملاحظة أمنية:</b> صفحة الإدارة محجوبة تماماً عن زوار الموقع وتظهر 404 إلا من خلال هذا الرابط أو الدومين المخصص لك. احتفظ بهذا الرابط سراً.
  </div>
</div>

<script>
'use strict';
const GATE = location.pathname.replace(/^\/+/, '');
const out = document.getElementById('out');

function show(kind, html) {
  out.className = 'out ' + kind;
  out.innerHTML = html;
}

async function call(path) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Gate': GATE }
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.error) || ('خطأ ' + res.status));
  return data;
}

document.getElementById('go').addEventListener('click', async () => {
  const btn = document.getElementById('go');
  btn.disabled = true;
  try {
    const r = await call('/api/admin/gate');
    try {
      localStorage.setItem('ichance.adminKey', r.key);
      document.cookie = 'ichance_admin_gate=' + encodeURIComponent(GATE) + '; path=/; max-age=86400; SameSite=Lax';
    } catch (e) {}
    show('ok', 'تم توليد مفتاح المالك بنجاح! جارٍ التحويل إلى لوحة التحكم…' +
               '<code>' + r.key + '</code>');
    setTimeout(() => {
      location.href = '/admin?gate=' + encodeURIComponent(GATE);
    }, 700);
  } catch (err) {
    show('bad', err.message);
    btn.disabled = false;
  }
});

document.getElementById('rot').addEventListener('click', async () => {
  if (!confirm('سيتوقف هذا الرابط فوراً ويتم توليد رابط سرّي جديد للمالك. متابعة؟')) return;
  const btn = document.getElementById('rot');
  btn.disabled = true;
  try {
    const r = await call('/api/admin/gate/path');
    show('ok', 'تم تغيير الرابط السري بنجاح! احفظ رابطك الجديد الآن فوراً:'
      + '<code>' + location.origin + '/' + r.path + '</code>');
  } catch (err) {
    show('bad', err.message);
    btn.disabled = false;
  }
});
</script>
</body>
</html>
